name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm exec tsc -b --noEmit

  integration:
    name: Integration tests (real Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Bootstrap and verify the backend contract
        run: node scripts/bootstrap-supabase.mjs

      - name: Start local Supabase
        working-directory: .supabase-backend
        run: supabase start

      - name: Integration tests
        run: pnpm test:integration

  types-drift:
    name: Types drift
    runs-on: ubuntu-latest
    # Skips cleanly until SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_ID are configured
    # as repo secrets (D-4) — they are deployment credentials, not part of the code.
    # The secrets context is not allowed in a job-level if, so the secret is mapped
    # to env here and every step is gated on it instead.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}

      - uses: pnpm/action-setup@v4
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}

      - uses: actions/setup-node@v4
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}

      - uses: supabase/setup-cli@v1
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        with:
          version: latest

      - name: Regenerate types into a temp file
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" --schema public > /tmp/database.types.ts

      - name: Fail on drift
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          diff -u src/lib/database.types.ts /tmp/database.types.ts || \
            (echo "deployed schema differs from committed database.types.ts — run pnpm gen:types" && exit 1)
