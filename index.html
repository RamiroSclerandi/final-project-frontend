<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>Telemetry Dashboard</title>
    <script>
      // Applies the stored theme before the first paint so the page never
      // flashes the default one. ThemeProvider owns it from mount onwards;
      // src/shared/design-system/theme/ThemeContext.ts holds the shared
      // constants and a contract test fails if these copies drift.
      try {
        var storedTheme = localStorage.getItem('ui.theme.v1')
        document.documentElement.dataset.theme =
          storedTheme === 'light' ? 'light' : 'dark'
      } catch (error) {
        // Site data can be blocked; the default theme still has to apply.
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
